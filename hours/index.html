<!doctype html>
<html lang="en">

<head>
  <title>Class calendar | Languapps</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.getElementsByTagName("html")[0].className += " js";</script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/calendar.css">
  <link rel="shortcut icon" href="images/yata.ico">
</head>

<body>
  <header class="cd-main-header text-center flex flex-column flex-center">
    <p class="margin-top-md margin-bottom-xl">👈 <a class="cd-article-link" href="/services/">Booking &amp; Trials</a></p>

    <h1 class="text-xl">Class calendar</h1>
    <p class="cd-cal__tz">The next 4 weeks, in <span id="cal-tz">your time zone</span> and Paris time</p>
  </header>

  <div class="cd-schedule cd-cal margin-top-lg margin-bottom-lg" id="cd-cal">
    <p class="cd-cal__status" id="cal-status" role="status">Loading classes…</p>

    <div class="cd-cal__weekdays" aria-hidden="true">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div class="cd-cal__grid" id="cal-grid"></div>

    <noscript><p class="cd-cal__status">This calendar needs JavaScript.</p></noscript>

    <div class="cd-schedule-modal">
      <header class="cd-schedule-modal__header">
        <div class="cd-schedule-modal__content">
          <span class="cd-schedule-modal__date"></span>
          <h3 class="cd-schedule-modal__name"></h3>
        </div>

        <div class="cd-schedule-modal__header-bg"></div>
      </header>

      <div class="cd-schedule-modal__body">
        <div class="cd-schedule-modal__event-info"></div>
        <div class="cd-schedule-modal__body-bg"></div>
      </div>

      <a href="#0" class="cd-schedule-modal__close text-replace">Close</a>
    </div>

    <div class="cd-schedule__cover-layer"></div>
  </div> <!-- .cd-schedule -->

  <script type="module" src="assets/js/calendar.js"></script>
</body>
</html>
